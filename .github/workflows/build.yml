name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unzip project
        run: unzip -q KonkurAnalyzer-source.zip -d proj
      - name: Patch KSP to kapt
        working-directory: proj
        run: |
          sed -i '/com.google.devtools.ksp/d' build.gradle.kts
          sed -i 's/id("com.google.devtools.ksp")/id("org.jetbrains.kotlin.kapt")/; s/ksp("androidx.room/kapt("androidx.room/; s/^ksp { arg(\(.*\)) }$/kapt { arguments { arg(\1) } }/' app/build.gradle.kts
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: proj
        run: gradle assembleDebug --stacktrace
      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp proj/app/build/outputs/apk/debug/app-debug.apk ./KonkurAnalyzer.apk
          gh release create "build-${{ github.run_number }}" KonkurAnalyzer.apk --title "Build ${{ github.run_number }}" --notes "Debug APK"
